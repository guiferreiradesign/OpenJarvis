# Example JARVIS additions to ~/.openjarvis/config.toml
# Copy the sections you need into your real config. Do not put secrets here.

[jarvis.media_workspace]
# Required. A dedicated folder that JARVIS may read; nothing outside it is visible.
root = "~/Movies/JARVIS"

# Optional settings (defaults shown).
# follow_symlinks = false
# include_hidden = false
# probe_metadata = true
# ffprobe_path = ""                # e.g. "/opt/homebrew/bin/ffprobe"
# max_files = 100
# max_depth = 8
# ffprobe_timeout_seconds = 15
# probe_budget_seconds = 60

[jarvis.media_render]
# Required for media_render / media_validate. An EXISTING folder outside the
# media workspace (they may not contain each other). The only place these
# tools write.
output_root = "~/Movies/JARVIS-Renders"

# Optional: folder holding branding PNGs referenced by plans.
# assets_root = "~/Movies/JARVIS-Assets"

# Optional settings (defaults shown).
# ffmpeg_path = ""                   # e.g. "/opt/homebrew/bin/ffmpeg"
# ffprobe_path = ""                  # default: media_workspace.ffprobe_path
# default_preset = "instagram_reel"  # 1080x1920, 9:16, 30 fps, H.264/AAC
# require_confirmation = false       # true: ask before every render
# render_timeout_seconds = 900
# validate_timeout_seconds = 300
# max_clips = 20
# max_output_seconds = 600
# duration_tolerance_seconds = 0.25
# preview_height = 640

# Optional extra presets:
# [jarvis.media_render.presets.square_post]
# width = 1080
# height = 1080
# frame_rate = 30
# max_duration_seconds = 60

[jarvis.jobs]
# Optional (Phase 3). Where the job database lives. Default:
# <OPENJARVIS_HOME>/jarvis/jobs.db (normally ~/.openjarvis/jarvis/jobs.db).
# A custom path must be absolute and its folder must already exist.
# database_path = ""
# max_attempts = 2                   # 1 or 2; retries only temporary failures

# Let agents use the tools by default.
[tools]
enabled = "media_workspace_inspect,media_render,media_validate,think"
